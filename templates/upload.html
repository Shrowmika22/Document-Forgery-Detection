<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Document - DocuGuard AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <a href="{{ url_for('home') }}" class="logo">
            DocuGuard <span>AI</span>
        </a>

    </nav>


    <main class="upload-page">

        <div class="upload-header">

            <div class="badge">
                🔍 Document Analysis
            </div>

            <h1>
                Upload Your Document
            </h1>

            <p>
                Upload a PDF or image to begin the analysis.
            </p>

        </div>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                <div class="error-message">

                    {% for message in messages %}

                        {{ message }}

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form
            action="{{ url_for('upload') }}"
            method="POST"
            enctype="multipart/form-data"
            class="upload-form"
        >

            <label for="document" class="drop-zone">

                <div class="upload-icon">
                    📁
                </div>

                <h2>
                    Choose a document
                </h2>

                <p>
                    Click here to browse your computer
                </p>

                <span>
                    PDF • JPG • JPEG • PNG
                </span>

                <input
                    type="file"
                    id="document"
                    name="document"
                    accept=".pdf,.jpg,.jpeg,.png"
                    required
                >

            </label>


            <button type="submit" class="primary-button analyze-button">

                🔍 Analyze Document

            </button>

        </form>


        <div class="security-note">

            🔒 Your document is processed securely for analysis.

        </div>

    </main>

</body>

</html>
